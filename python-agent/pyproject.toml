[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kimo-engine"
version = "0.1.0"
description = "Kimo — a fast, accurate Python agent engine (reimplementation of the Property Manager app's assistant)."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["kimo*"]
