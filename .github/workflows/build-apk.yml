name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android

      - name: Configure signing (keystore + properties)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/realestate-app.keystore
          cat > android/keystore.properties <<EOF
          storeFile=realestate-app.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK signature (real check, no masking)
        working-directory: android
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*release*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER_JAR=$(ls $ANDROID_HOME/build-tools/*/lib/apksigner.jar | tail -1)
          echo "Using: $APKSIGNER_JAR"
          APK_DIGEST=$(java -jar "$APKSIGNER_JAR" verify --print-certs "$APK" | grep -i "sha-256 digest" | awk '{print $NF}')
          echo "APK SHA-256 digest: $APK_DIGEST"
          KEY_DIGEST=$(keytool -list -v -keystore realestate-app.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>/dev/null | grep -i "sha256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "Keystore SHA-256:   $KEY_DIGEST"
          [ "$APK_DIGEST" = "$KEY_DIGEST" ] && echo "SIGNATURE MATCH: APK موقّع بمفتاحنا" || { echo "MISMATCH: التوقيع لا يطابق المفتاح!"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: realestate-app-release
          path: android/app/build/outputs/apk/release/*release*.apk
          if-no-files-found: error
