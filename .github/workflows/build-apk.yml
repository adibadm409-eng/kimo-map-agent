name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, kimo-embedded-build]

env:
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (minimal)
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;37.0.0 platform-tools

      - name: Export Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Invariant tests
        run: npm run test:invariants

      - name: Generate Android project
        run: npx expo prebuild --platform android

      - name: Patch Chaquopy (embedded kimo engine)
        run: python3 scripts/patch_chaquopy.py

      - name: Install NDK (cached)
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-${{ runner.os }}-${{ hashFiles('android/build.gradle') }}
          restore-keys: ndk-${{ runner.os }}-
      - name: Install matching NDK (if not cached)
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          NDK_VER=$(grep -oP 'ndkVersion "\K[^"]+' android/build.gradle || true)
          if [ -n "$NDK_VER" ]; then sdkmanager "ndk;$NDK_VER"; fi
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Configure signing (keystore + release signingConfig)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/realestate-app.keystore
          python3 - <<'PYEOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          old_signing = """        debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }"""
          new_signing = """        debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
                  release {
                      if (project.hasProperty('RELEASE_STORE_FILE')) {
                          storeFile file(RELEASE_STORE_FILE)
                          storePassword RELEASE_STORE_PASSWORD
                          keyAlias RELEASE_KEY_ALIAS
                          keyPassword RELEASE_KEY_PASSWORD
                      }
                  }
              }"""
          assert old_signing in s, "signingConfigs block not found"
          s = s.replace(old_signing, new_signing)
          old_build = """        release {
                      // Caution! In production, you need to generate your own keystore file.
                      // see https://reactnative.dev/docs/signed-apk-android.
                      signingConfig signingConfigs.debug"""
          new_build = """        release {
                      signingConfig signingConfigs.release"""
          assert old_build in s, "release buildType block not found"
          s = s.replace(old_build, new_build)
          open(p, 'w').write(s)
          print("signing patched OK")
          PYEOF
          cat >> android/gradle.properties <<'EOF'
          RELEASE_STORE_FILE=../realestate-app.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Tune Gradle
        run: |
          cat >> android/gradle.properties <<EOF
          org.gradle.caching=true
          org.gradle.daemon=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m
          EOF

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Verify APK signature
        working-directory: android
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*release*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER_JAR=$(ls $ANDROID_HOME/build-tools/*/lib/apksigner.jar | tail -1)
          APK_DIGEST=$(java -jar "$APKSIGNER_JAR" verify --print-certs "$APK" | grep -i "sha-256 digest" | awk '{print $NF}')
          KEY_DIGEST=$(keytool -list -v -keystore realestate-app.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>/dev/null | grep -i "sha256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "APK: $APK_DIGEST"
          echo "KEY: $KEY_DIGEST"
          [ "$APK_DIGEST" = "$KEY_DIGEST" ] && echo "✓ SIGNATURE MATCH" || { echo "✗ MISMATCH"; exit 1; }

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*release*.apk | head -1)
          VERSION=$(date +%Y%m%d-%H%M)
          gh release create "v${VERSION}" "$APK" \
            --repo "${{ github.repository }}" \
            --title "Kimo Map Agent v${VERSION}" \
            --notes "arm64-v8a — $(du -h "$APK" | cut -f1)" \
            --latest
